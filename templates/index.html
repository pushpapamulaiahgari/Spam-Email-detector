<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        <h1>📧 Spam Detector</h1>
        <form method="POST">
            <textarea name="message" placeholder="Type a message to check..." required></textarea>
            <button type="submit">Check Now</button>
        </form>
        {% if result %}
            <h2>{{ result }}</h2>
        {% endif %}
    </div>
</body>
</html>
